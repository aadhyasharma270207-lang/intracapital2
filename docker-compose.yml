version: '3.8'

services:
  fastapi:
    build: .
    container_name: intracapital_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GRANITE_MODEL=granite3.1-dense:8b
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - DATABASE_URL=sqlite:///./intracapital.db
    volumes:
      - ./uploaded_documents:/app/uploaded_documents
      - ./intracapital.db:/app/intracapital.db
    depends_on:
      - qdrant
      - neo4j

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: intracapital_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  neo4j:
    image: neo4j:5.17-community
    container_name: intracapital_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  qdrant_storage:
  neo4j_data:
