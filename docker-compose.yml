version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PROJECT_ENV=production
      - GRANITE_MODEL=${GRANITE_MODEL:-granite3-dense:8b}
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - DATABASE_URL=sqlite:////app/data/intracapital.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - ENABLE_EXTERNAL_DATA=${ENABLE_EXTERNAL_DATA:-false}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    depends_on:
      - qdrant
      - neo4j
      - ollama
    networks:
      - intracapital-net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - intracapital-net

  neo4j:
    image: neo4j:5.20.0-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - intracapital-net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - intracapital-net

volumes:
  backend_data:
  backend_uploads:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:

networks:
  intracapital-net:
    driver: bridge
